# The disabled set is the shared oakoss rule set, so prose reads the same across
# repositories.
#
# rumdl owns .md outright. dprint configures no markdown plugin, and its
# `**/*.md` exclude keeps that true if one is ever added, so there is exactly one
# writer per file type and no oscillation between formatters.

[global]
respect-gitignore = true

disable = [
  "MD001", # heading levels must increment by one
  "MD012", # multiple consecutive blank lines
  "MD013", # line length — prose is wrapped by the editor, not by a rule
  "MD024", # duplicate heading text, which specs and ADRs use by design
  "MD025", # multiple top-level headings
  "MD026", # trailing punctuation in a heading
  "MD029", # ordered list numbering style
  "MD033", # inline HTML
  "MD036", # emphasis used instead of a heading
  "MD037", # spaces inside emphasis markers
  "MD041", # first line must be a top-level heading
  "MD060", # table column alignment — opt-in in rumdl, listed for parity
]

# Only tracked-but-tool-owned paths. `respect-gitignore` above covers everything
# .gitignore already lists, so naming those here would be a second copy to keep
# in sync.
#
# CHANGELOG.md is generated by release-plz via git-cliff; formatting it here
# would fight the next release. .agents and .claude are agent tooling, not
# project prose.
exclude = [
  ".beads",
  ".claude",
  ".agents",
  "CHANGELOG.md",
]

[MD007]
indent = 2

[MD046]
style = "fenced"
