[package]
name = "autocomplete-rs"
version = "0.1.3"
authors = ["Jace Babin"]
categories = ["command-line-utilities"]
edition = "2024"
exclude = [
  ".agents/",
  ".beads/",
  ".claude/",
  ".editorconfig",
  ".github/",
  ".gitleaks.toml",
  ".mise.toml",
  ".rumdl.toml",
  "cliff.toml",
  "clippy.toml",
  "cog.toml",
  "deny.toml",
  "dist-workspace.toml",
  "docs/",
  "dprint.json",
  "lefthook.yml",
  "release-plz.toml",
  "rustfmt.toml",
]
homepage = "https://github.com/jbabin91/autocomplete-rs"
keywords = ["autocomplete", "shell", "terminal", "completion", "cli"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jbabin91/autocomplete-rs"
rust-version = "1.89"
description = "Fast, universal terminal autocomplete for all shells and terminals"

[lib]
name = "autocomplete_rs"
path = "src/lib.rs"

[[bin]]
name = "autocomplete-rs"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] } # CancellationToken

# System
libc = "0.2" # kill(pid, 0) for PID file

# Serialization
rmp-serde = "1.3" # MessagePack for efficient spec storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Identifiers
uuid = { version = "1", features = ["v4"] }

# Storage
turso = { version = "0.6", default-features = false }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Overlay windowing
softbuffer = "0.4.8"
# Defaults minus `wayland-csd-adwaita`, which pulls sctk-adwaita -> ab_glyph ->
# ttf-parser (unmaintained, RUSTSEC-2026-0192, no upgrade available). CSD is
# Wayland title bars; the overlay is a borderless panel and does not use them.
# Cargo has no subtract-a-feature syntax, so the kept defaults are spelled out —
# a new winit default will not reach this list on its own (autocomplete-rs-viw).
winit = { version = "0.31.0-beta.2", default-features = false, features = [
  "x11",
  "wayland",
  "wayland-dlopen",
] }

# macOS overlay positioning (Accessibility API)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSColor",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = [
  "NSGeometry",
  "NSString",
  "NSThread",
] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[build-dependencies]
# For parsing TypeScript specs at build time (Phase 2)
# deno_ast = "0.40"  # TODO: Enable in Phase 2 when implementing spec parsing
anyhow = "1.0"

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "privacy"
harness = false

[[bench]]
name = "handler"
harness = false

[[bench]]
name = "parser"
harness = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
