[package]
name = "autocomplete-rs"
version = "0.1.2"
authors = ["Jace Babin"]
categories = ["command-line-utilities"]
edition = "2024"
rust-version = "1.85"
homepage = "https://github.com/jbabin91/autocomplete-rs"
keywords = ["autocomplete", "shell", "terminal", "completion", "cli"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jbabin91/autocomplete-rs"
description = "Fast, universal terminal autocomplete for all shells and terminals"
exclude = [
  ".agents/",
  ".beads/",
  ".claude/",
  ".github/",
  ".markdownlint-cli2.jsonc",
  ".prettierrc.toml",
  "cliff.toml",
  "clippy.toml",
  "cog.toml",
  "deny.toml",
  "dist-workspace.toml",
  "docs/",
  "hk.pkl",
  "mise.toml",
  "PklProject",
  "PklProject.deps.json",
  "release-plz.toml",
  "rustfmt.toml",
  "taplo.toml",
]

[lib]
name = "autocomplete_rs"
path = "src/lib.rs"

[[bin]]
name = "autocomplete-rs"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.48", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }   # CancellationToken

# System
libc = "0.2"                                           # kill(pid, 0) for PID file

# Serialization
rmp-serde = "1.1"                                  # MessagePack for efficient spec storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

[build-dependencies]
# For parsing TypeScript specs at build time (Phase 2)
# deno_ast = "0.40"  # TODO: Enable in Phase 2 when implementing spec parsing
anyhow = "1.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
