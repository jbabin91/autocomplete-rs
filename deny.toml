[graph]
all-features = true

[advisories]
yanked = "deny"
# `paste` is unmaintained (RUSTSEC-2024-0436) but is a transitive dep of
# turso_core — we can't remove it. The crate is feature-complete and has
# no known security vulnerabilities; the advisory is informational only.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
