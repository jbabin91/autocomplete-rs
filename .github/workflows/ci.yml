name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: Test
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Run tests
        run: cargo test --all-features

  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-plz-')
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-status:
    name: CI Status
    if: always()
    needs: [lint, test, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          icon() {
            case "$1" in
              success) echo "✅";;
              skipped) echo "⏭️";;
              failure) echo "❌";;
              cancelled) echo "🚫";;
              *) echo "❓";;
            esac
          }

          failed=false
          jobs=(
            "Lint|${{ needs.lint.result }}"
            "Test|${{ needs.test.result }}"
            "PR Title|${{ needs.pr-title.result }}"
          )

          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            for job in "${jobs[@]}"; do
              name="${job%%|*}"
              result="${job##*|}"
              echo "| ${name} | $(icon "$result") ${result} |"
              if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
                failed=true
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" == "true" ]]; then
            echo ""
            echo "::error::CI failed — see table above for details"
            exit 1
          fi
