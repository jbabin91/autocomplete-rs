name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  format:
    name: Format
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Setup mise
        uses: ./.github/actions/setup-mise
      - name: Run static analysis
        uses: ./.github/actions/static-analysis

  lint:
    name: Lint
    needs: [format]
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features

  test:
    name: Test
    needs: [format]
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Run tests
        uses: ./.github/actions/run-tests

  msrv:
    name: MSRV
    needs: [format]
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | sed 's/.*= *\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - name: Setup Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Restore cargo cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - name: Check MSRV compatibility
        run: cargo check --locked --all-features

  deny:
    name: Deny
    needs: [format]
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@3fd3802e88374d3fe9159b834c7714ec57d6c979 # v2

  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-plz-')
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-status:
    name: CI Status
    if: always()
    needs: [format, lint, test, msrv, deny, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          icon() {
            case "$1" in
              success) echo "✅";;
              skipped) echo "⏭️";;
              failure) echo "❌";;
              cancelled) echo "🚫";;
              *) echo "❓";;
            esac
          }

          failed=false
          jobs=(
            "Format|${{ needs.format.result }}"
            "Lint|${{ needs.lint.result }}"
            "Test|${{ needs.test.result }}"
            "MSRV|${{ needs.msrv.result }}"
            "Deny|${{ needs.deny.result }}"
            "PR Title|${{ needs.pr-title.result }}"
          )

          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            for job in "${jobs[@]}"; do
              name="${job%%|*}"
              result="${job##*|}"
              echo "| ${name} | $(icon "$result") ${result} |"
              if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
                failed=true
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" == "true" ]]; then
            echo ""
            echo "::error::CI failed — see table above for details"
            exit 1
          fi
