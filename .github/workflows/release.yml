name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC for crates.io trusted publishing
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ secrets.AUTOMATED_COMMIT_SIGNER_APP_ID }}
          private-key: ${{ secrets.AUTOMATED_COMMIT_SIGNER_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@20b23932963f7971bdff386c3542f07fbec45f42 # v0.5.125
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
