name: Security Audit

on:
  # ci.yml calls this on every pull request and push, which is what makes it
  # gateable through CI Status. No push/pull_request triggers here, or it would
  # run twice for the same commit.
  workflow_call:
  # The trigger it needs of its own: cargo-deny fetches the RustSec database at
  # run time, so an advisory filed against an unchanged Cargo.lock stays
  # invisible until something re-runs the check, and no commit ever will.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Audit mode logs unauthorized egress without blocking; enforcement waits
      # on an allowlist built from real runs.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Full toolchain, not a scoped install: cargo-deny shells out to
      # `cargo metadata` to build the graph.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit dependencies
        run: mise run audit
