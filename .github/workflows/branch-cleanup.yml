name: Branch Cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  # Delete branches from PRs closed without merging
  closed-pr:
    name: Delete unmerged PR branch
    if: github.event_name == 'pull_request' && !github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }} -X DELETE

  # Remove branches with no activity for 30+ days
  stale:
    name: Remove stale branches
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove stale branches
        uses: fpicalausa/remove-stale-branches@b8aaebc3b28b9e34e010fa2b21ae360722a95581 # v2.5.0
        with:
          days-before-branch-stale: 30
          days-before-branch-delete: 7
          exempt-branches-regex: ^(main|beads-sync)$
          ignore-branches-with-open-prs: true
          operations-per-run: 10
