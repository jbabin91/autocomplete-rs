name: Release PLZ

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC for crates.io trusted publishing
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      # Audit mode logs unauthorized egress without blocking; enforcement waits
      # on an allowlist built from real runs. This job holds contents: write and
      # the crates.io OIDC token, so it is the one most worth watching.
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.AUTOMATED_ACTIONS_AGENT_APP_ID }}
          private-key: ${{ secrets.AUTOMATED_ACTIONS_AGENT_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run release-plz
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
