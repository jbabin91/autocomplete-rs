name: Release PLZ

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC for crates.io trusted publishing
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.AUTOMATED_ACTIONS_AGENT_APP_ID }}
          private-key: ${{ secrets.AUTOMATED_ACTIONS_AGENT_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Run release-plz
        uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5.128
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
