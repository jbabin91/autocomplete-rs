name: Release PLZ

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC for crates.io trusted publishing
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      # Audit mode logs unauthorized egress without blocking; enforcement waits
      # on an allowlist built from real runs. This job holds contents: write and
      # the crates.io OIDC token, so it is the one most worth watching.
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMATED_ACTIONS_AGENT_APP_ID }}
          private-key: ${{ secrets.AUTOMATED_ACTIONS_AGENT_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
