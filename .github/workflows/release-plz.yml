name: Release PLZ

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-plz:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC for crates.io trusted publishing
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      # Audit mode logs unauthorized egress without blocking; enforcement waits
      # on an allowlist built from real runs. This job holds contents: write and
      # the crates.io OIDC token, so it is the one most worth watching.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMATED_ACTIONS_AGENT_APP_ID }}
          private-key: ${{ secrets.AUTOMATED_ACTIONS_AGENT_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run release-plz
        uses: release-plz/action@aec534bbd8631793b9b3b8f1ee6cd886c322e17f # v0.5.133
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
