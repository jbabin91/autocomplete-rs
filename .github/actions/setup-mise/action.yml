name: Setup mise
description: Install mise with taplo, prettier, and markdownlint-cli2

inputs:
  cache_key_prefix:
    description: Cache key prefix for manual cache busting
    required: false
    default: mise-v1

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      with:
        install_args: taplo npm:prettier npm:markdownlint-cli2
        cache_key: ${{ inputs.cache_key_prefix }}-{{platform}}-{{install_args_hash}}
