name: Setup Rust
description: Install Rust toolchain and restore cache (repo must already be checked out)

inputs:
  components:
    description: Comma-separated list of rustup components (e.g., rustfmt, clippy)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@v2
