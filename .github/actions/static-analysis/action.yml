name: Static Analysis
description: Run all formatting and linting checks (Rust, TOML, Markdown, Prettier). Requires Rust (rustfmt) and mise tools to be installed first.

runs:
  using: composite
  steps:
    - name: Check Rust formatting
      run: cargo fmt --all -- --check
      shell: bash
    - name: Check TOML formatting
      run: taplo fmt --check
      shell: bash
    - name: Check file formatting
      run: prettier -uc '**/*.{json,md,yml,yaml}'
      shell: bash
    - name: Lint markdown
      run: markdownlint-cli2 '**/*.md'
      shell: bash
