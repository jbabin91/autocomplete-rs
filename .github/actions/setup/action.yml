name: Setup
description: Install mise and the project toolchain

inputs:
  tools:
    description: >
      Space-separated mise tools to install. Empty installs everything in
      .mise.toml. A job needing one tool passes its name, and must also set
      MISE_AUTO_INSTALL=0 on the step that runs the task — `mise run` otherwise
      installs the rest of .mise.toml on demand and the scoping buys nothing.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # mise installs the Rust toolchain declared in .mise.toml, components
    # included. A second toolchain action here would leave which `cargo` runs
    # dependent on PATH ordering, and rust-cache keys on whichever rustc it sees.
    - name: Install mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        install: true
        install_args: ${{ inputs.tools }}
        cache: true

    # Both steps below assume a Rust toolchain, which a scoped install does not
    # provide.
    - name: Cache cargo
      if: inputs.tools == ''
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Toolchain provenance
      if: inputs.tools == ''
      shell: bash
      # Diagnostics, so a toolchain surprise shows up in the log rather than
      # being inferred from a later failure.
      run: |
        echo "cargo -> $(command -v cargo)"
        cargo --version
        rustc --version
        cargo clippy --version
