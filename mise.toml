# mise configuration for autocomplete-rs
# Install tools: mise install
# Run tasks: mise run <task>

# Development tools
[tools]
# Pre-built binaries (fast install)
taplo = "latest"
hk = "latest"
pkl = "latest"
cocogitto = "latest"

# Cargo tools (compile from source)
"cargo:cargo-nextest" = "latest"

# npm tools
"npm:prettier" = "latest"
"npm:markdownlint-cli2" = "latest"

# Tasks (replaces Makefile)
[tasks.fmt]
description = "Format all files (Rust + TOML/Markdown/JSON)"
run = [
  "cargo fmt --all",
  "taplo fmt",
  "prettier -uwl '**/*.{json,md,yml,yaml}'",
]

[tasks.fmt-check]
description = "Check formatting without modifying"
run = [
  "cargo fmt --all -- --check",
  "taplo fmt --check",
  "prettier -uc '**/*.{json,md,yml,yaml}'",
]

[tasks.check]
description = "Quick type check"
run = "cargo check --all-targets --all-features"

[tasks.lint]
description = "Run all linters (clippy + markdownlint)"
run = [
  "cargo clippy --all-targets --all-features -- -D warnings",
  "markdownlint-cli2 '**/*.md'",
]

[tasks.lint-fix]
description = "Run linters with auto-fix where supported"
run = [
  "cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features",
  "markdownlint-cli2 -f '**/*.md'",
]

[tasks.test]
description = "Run tests"
run = "cargo nextest run --all-features --no-tests=warn"

[tasks.build]
description = "Build in debug mode"
run = "cargo build"

[tasks.release]
description = "Build optimized release"
run = "cargo build --release"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.install]
description = "Install binary locally"
run = "cargo install --path ."

[tasks.publish]
description = "Publish to crates.io"
run = "cargo publish"

[tasks.ci]
description = "Run all CI checks"
depends = ["fmt-check", "check", "lint", "test"]

[tasks.bench]
description = "Run benchmarks"
run = "cargo bench --all-features"

[tasks.watch]
description = "Watch for changes and run checks"
run = "cargo watch -x check -x test"
