[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Homebrew tap repository
tap = "jbabin91/homebrew-tap"
# Publish Homebrew formula on release
publish-jobs = ["homebrew"]
# Don't run on PRs (CI handles PR validation)
pr-run-mode = "skip"
# Enable GitHub artifact attestations
github-attestations = true
# Embed dependency tree in binaries for security scanning (cargo audit bin)
cargo-auditable = true
# release.yml is hand-edited after generation, so dist must not treat it as
# stale. Remove temporarily when regenerating: dist generate-ci
allow-dirty = ["ci"]
# Use ubuntu-latest so Renovate doesn't create PRs for runner updates
[dist.github-custom-runners]
global = "ubuntu-latest"

# Pin GitHub Actions to specific commit SHAs for supply chain security.
#
# This block is what release.yml is generated from, so it is the source of
# truth and `mise run check` fails when the two disagree. The version comment
# is load-bearing twice over: it is the only thing that says what a SHA is to
# someone reviewing a bump, and the renovate.json customManager reads it as the
# current version. Every SHA here is a release tag's own commit — an untagged
# mid-stream commit has no honest version to write next to it, and Renovate
# cannot resolve one either.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "37930b1c2abaa49bbe596cd826c3c89aef350131" # v7.0.0
"actions/attest-build-provenance" = "4d101475d8b20a2381f78447822ac1eab6504dd8" # v4.2.2
