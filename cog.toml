# Cocogitto configuration
# Only used for commit message validation (cog verify)
# Versioning and changelog handled by release-plz

# Read by both `cog verify` (the commit-msg hook) and `cog check` (CI), so the
# two callers stay identical by construction instead of by matching flags.
# Merge and fixup messages are generated by git and cannot be conventional;
# without these, a conflicted merge or `git commit --fixup` is blocked outright.
ignore_merge_commits = true
ignore_fixup_commits = true

[changelog]
# Not used — release-plz + git-cliff handles changelog generation
# Included to prevent cog from using defaults if accidentally invoked
path = "CHANGELOG.md"

[commit_types]
# Standard conventional commit types
# https://www.conventionalcommits.org/
feat = { changelog_title = "Features" }
fix = { changelog_title = "Bug Fixes" }
docs = { changelog_title = "Documentation" }
style = { changelog_title = "Style" }
refactor = { changelog_title = "Refactoring" }
perf = { changelog_title = "Performance" }
test = { changelog_title = "Tests" }
build = { changelog_title = "Build" }
ci = { changelog_title = "CI" }
chore = { changelog_title = "Chore", omit_from_changelog = true }
revert = { changelog_title = "Reverts" }
